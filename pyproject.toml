[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "randall-segmentation"
version = "0.1.0"
description = "Public image-segmentation and marginal-image extraction pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "accelerate>=1.10,<2",
  "datasets>=4.0,<5",
  "einops>=0.8,<1",
  "Flask>=3.1,<4",
  "gradio>=6.0,<7",
  "huggingface-hub>=0.35,<1",
  "h5py>=3.11,<4",
  "imageio>=2.37,<3",
  "matplotlib>=3.9,<4",
  "numpy>=1.26,<3",
  "opencv-python>=4.10,<5",
  "pandas>=2.2,<3",
  "Pillow>=11,<13",
  "pyarrow>=18,<22",
  "safetensors>=0.5,<1",
  "scikit-learn>=1.6,<2",
  "scipy>=1.14,<2",
  "seaborn>=0.13,<1",
  "tensorboardX>=2.6,<3",
  "tqdm>=4.66,<5",
  "transformers>=4.57,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
]

[tool.setuptools.packages.find]
include = ["randall_pipeline*", "scripts*", "segment_anything*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
